<svg width="751" height="170" viewBox="0 0 751 170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pola grid latar statis, tanpa animasi -->
    <pattern id="grid" x="20" y="20" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="11" height="11" rx="2.5" fill="#161b22"/>
    </pattern>
  </defs>

  <style>
    .letter {
      animation: flicker 6s ease-in-out infinite both;
    }
    .letter.t { animation-delay: 0s; }
    .letter.h { animation-delay: 0.15s; }
    .letter.a { animation-delay: 0.3s; }
    .letter.n { animation-delay: 0.45s; }
    .letter.k { animation-delay: 0.6s; }
    .letter.y { animation-delay: 0.75s; }
    .letter.o { animation-delay: 0.9s; }
    .letter.u { animation-delay: 1.05s; }

    .signature {
      animation: sig 6s ease-in-out infinite both;
    }

    @keyframes flicker {
      0%   { opacity: 0; }
      4%   { opacity: 0.8; }
      7%   { opacity: 0.2; }
      10%  { opacity: 0.95; }
      13%  { opacity: 0.5; }
      16%  { opacity: 1; }
      55%  { opacity: 1; }
      65%  { opacity: 0.3; }
      70%  { opacity: 0.75; }
      75%  { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes sig {
      0%   { opacity: 0; }
      45%  { opacity: 0; }
      52%  { opacity: 0.9; }
      56%  { opacity: 1; }
      72%  { opacity: 1; }
      78%  { opacity: 0; }
      100% { opacity: 0; }
    }
  </style>

  <!-- Latar belakang -->
  <rect width="751" height="170" rx="12" fill="#0d1117"/>
  <!-- Grid latar dengan pola -->
  <rect x="0" y="0" width="751" height="170" fill="url(#grid)"/>

  <!-- Huruf T -->
  <g class="letter t" fill="#57e389">
    <rect x="34" y="20" width="11" height="11" rx="2.5"/>
